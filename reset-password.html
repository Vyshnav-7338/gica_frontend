<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | GICA</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <header class="auth-header"><a class="brand brand-image" href="index.html"><img src="images/GICA-logo.png" alt="GICA"></a><a class="auth-back" href="login.html">Back to login →</a></header>
  <main class="auth-layout">
    <section class="auth-story"><p class="eyebrow"><span></span> Creator account</p><h1>Reset your <em>password.</em></h1><p>Verify your email address to choose a new password.</p></section>
    <section class="auth-card"><div class="auth-card-head"><span>ACCOUNT RECOVERY</span><h2>Password reset</h2></div>
      <form class="auth-form" id="reset-form">
        <label>Email address<input required type="email" name="email" autocomplete="email"></label>
        <button class="button primary" id="reset-send" type="button">Send verification code</button>
        <label>Verification code<input required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" name="otp"></label>
        <button class="button primary" id="reset-verify" type="button">Verify code</button>
        <label>New password<input required type="password" name="password" minlength="8" autocomplete="new-password"></label>
        <label>Confirm password<input required type="password" name="confirmPassword" minlength="8" autocomplete="new-password"></label>
        <button class="button primary" type="submit">Reset password</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="api-client.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
